name: Stream CI

on:
  push:
    branches: [main, 'stream/**']
    paths: ['stream/**']
  pull_request:
    paths: ['stream/**']

defaults:
  run:
    working-directory: stream

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v2

      - name: Build stream library
        run: bazel build //src/api:stream_api //src/core:stream_core

      - name: Build WebRTC backend
        run: bazel build //src/backend/webrtc:webrtc_backend

      - name: Build example
        run: bazel build //src/examples:encode_and_push

  android-cross-build:
    name: android arm64 cross-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v2
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
      - name: Cross-build stream core + mock backend
        working-directory: stream
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$(ls -d "${ANDROID_SDK_ROOT:-$HOME/Android/sdk}/ndk"/* 2>/dev/null | tail -1)}"
          bazel build //src/core:stream_core //src/backend/mock:mock_backend --config android_arm64
