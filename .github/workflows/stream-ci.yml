name: Stream CI

on:
  push:
    branches: [main, 'stream/**']
    paths: ['stream/**']
  pull_request:
    paths: ['stream/**']

defaults:
  run:
    working-directory: stream

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v2

      - name: Build stream library
        run: bazel build //src/api:stream_api //src/core:stream_core

      - name: Build test server
        run: bazel build //src/test_server:whip_test_server

      - name: Run tests
        run: bazel test //tests/...