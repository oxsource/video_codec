name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ matrix.os }}-${{ github.sha }}
          restore-keys: bazel-${{ matrix.os }}-
      - name: Build
        working-directory: codec
        run: bazel build //...
      - name: Test
        working-directory: codec
        run: bazel test //...
      - name: clang-format
        if: matrix.os == 'ubuntu-22.04'
        working-directory: codec
        run: |
          find src -name '*.h' -o -name '*.cc' | xargs clang-format --dry-run --Werror
      - name: clang-tidy
        if: matrix.os == 'ubuntu-22.04'
        working-directory: codec
        run: bazel build //... && echo "clang-tidy gate (configure per project)"
